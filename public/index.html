<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Video Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700">
    <h1 class="text-2xl font-bold text-center mb-1 bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 bg-clip-text text-transparent">
      Universal Downloader
    </h1>
    <p class="text-xs text-slate-400 text-center mb-4">TikTok, Reels, Twitter/X e Shorts sem marca d'água</p>

    <!-- Badges de plataformas suportadas -->
    <div class="flex justify-center space-x-2 mb-6">
      <span class="text-[10px] bg-slate-700/80 px-2 py-0.5 rounded-full text-slate-300">TikTok</span>
      <span class="text-[10px] bg-pink-900/40 text-pink-300 border border-pink-700/50 px-2 py-0.5 rounded-full">Instagram</span>
      <span class="text-[10px] bg-blue-900/40 text-blue-300 border border-blue-700/50 px-2 py-0.5 rounded-full">Twitter / X</span>
      <span class="text-[10px] bg-red-900/40 text-red-300 border border-red-700/50 px-2 py-0.5 rounded-full">YouTube</span>
    </div>

    <div class="space-y-4">
      <input 
        type="url" 
        id="videoUrlInput" 
        placeholder="Cole o link do vídeo aqui..." 
        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-sm text-white"
      />

      <button 
        id="btnSearch" 
        onclick="fetchVideo()" 
        class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl transition duration-200"
      >
        Buscar Vídeo
      </button>

      <div id="status" class="text-center text-sm hidden"></div>

      <!-- Card com o resultado -->
      <div id="resultCard" class="hidden mt-6 pt-4 border-t border-slate-700 space-y-4">
        <div class="flex items-center space-x-3">
          <img id="videoThumb" class="w-16 h-16 rounded-lg object-cover bg-slate-700" src="" alt="Thumbnail" />
          <div class="overflow-hidden">
            <div class="flex items-center space-x-2">
              <span id="platformBadge" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-600"></span>
              <p id="videoAuthor" class="text-xs text-indigo-300 truncate"></p>
            </div>
            <p id="videoTitle" class="text-sm truncate text-slate-200 mt-1"></p>
          </div>
        </div>

        <button 
          id="btnDownload" 
          onclick="triggerDirectDownload()" 
          class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-semibold rounded-xl transition duration-200 flex items-center justify-center space-x-2"
        >
          <span>⬇ Baixar Vídeo</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    let currentVideoUrl = "";
    let currentVideoTitle = "video";

    async function fetchVideo() {
      const urlInput = document.getElementById('videoUrlInput').value.trim();
      const status = document.getElementById('status');
      const resultCard = document.getElementById('resultCard');
      const btnSearch = document.getElementById('btnSearch');

      if (!urlInput) {
        alert('Cole a URL de um vídeo.');
        return;
      }

      status.className = 'text-center text-sm text-yellow-400 block';
      status.innerText = 'Processando vídeo da plataforma...';
      resultCard.classList.add('hidden');
      btnSearch.disabled = true;

      try {
        const response = await fetch(`/api/download?url=${encodeURIComponent(urlInput)}`);
        const data = await response.json();

        if (response.ok && data.success) {
          status.classList.add('hidden');
          
          currentVideoUrl = data.videoUrl;
          currentVideoTitle = (data.title || 'video').replace(/[\\/*?:"<>|]/g, '').slice(0, 30);
          
          document.getElementById('videoThumb').src = data.cover;
          document.getElementById('platformBadge').innerText = data.platform || 'Vídeo';
          document.getElementById('videoAuthor').innerText = data.author ? `@${data.author}` : '';
          document.getElementById('videoTitle').innerText = data.title;
          
          resultCard.classList.remove('hidden');
        } else {
          status.className = 'text-center text-sm text-rose-400 block';
          status.innerText = data.error || 'Não foi possível baixar este vídeo.';
        }
      } catch (err) {
        status.className = 'text-center text-sm text-rose-400 block';
        status.innerText = 'Erro de comunicação com o servidor.';
      } finally {
        btnSearch.disabled = false;
      }
    }

    async function triggerDirectDownload() {
      const btnDownload = document.getElementById('btnDownload');
      const originalText = btnDownload.innerHTML;

      if (!currentVideoUrl) return;

      btnDownload.disabled = true;
      btnDownload.innerHTML = `
        <svg class="animate-spin h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <span class="ml-2">Baixando arquivo...</span>
      `;

      try {
        const response = await fetch(currentVideoUrl);
        const blob = await response.blob();
        
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = blobUrl;
        a.download = `${currentVideoTitle}.mp4`;
        
        document.body.appendChild(a);
        a.click();
        
        window.URL.revokeObjectURL(blobUrl);
        document.body.removeChild(a);
      } catch (error) {
        // Fallback se a API externa bloquear download por CORS
        window.open(currentVideoUrl, '_blank');
      } finally {
        btnDownload.disabled = false;
        btnDownload.innerHTML = originalText;
      }
    }
  </script>
</body>
</html>
