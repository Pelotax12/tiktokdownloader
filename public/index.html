<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Video & Audio Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700">
    <h1 class="text-2xl font-bold text-center mb-1 bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 bg-clip-text text-transparent">
      Universal Downloader
    </h1>
    <p class="text-xs text-slate-400 text-center mb-4">TikTok, YouTube, Twitter/X e Instagram</p>

    <!-- Badges de plataformas -->
    <div class="flex justify-center space-x-2 mb-6">
      <span class="text-[10px] bg-slate-700/80 px-2 py-0.5 rounded-full text-slate-300">TikTok</span>
      <span class="text-[10px] bg-red-900/40 text-red-300 border border-red-700/50 px-2 py-0.5 rounded-full">YouTube</span>
      <span class="text-[10px] bg-blue-900/40 text-blue-300 border border-blue-700/50 px-2 py-0.5 rounded-full">Twitter / X</span>
      <span class="text-[10px] bg-pink-900/40 text-pink-300 border border-pink-700/50 px-2 py-0.5 rounded-full">Instagram</span>
    </div>

    <div class="space-y-4">
      <input 
        type="url" 
        id="mediaUrlInput" 
        placeholder="Cole o link aqui (YouTube, X, TikTok...)" 
        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-sm text-white"
      />

      <button 
        id="btnSearch" 
        onclick="fetchMedia()" 
        class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl transition duration-200"
      >
        Buscar Mídia
      </button>

      <div id="status" class="text-center text-sm hidden"></div>

      <!-- Card de Resultado -->
      <div id="resultCard" class="hidden mt-6 pt-4 border-t border-slate-700 space-y-4">
        <div class="flex items-center space-x-3">
          <img id="mediaThumb" class="w-16 h-16 rounded-lg object-cover bg-slate-700 flex-shrink-0" src="" alt="Thumbnail" />
          <div class="overflow-hidden">
            <div class="flex items-center space-x-2">
              <span id="platformBadge" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-600"></span>
              <p id="mediaAuthor" class="text-xs text-indigo-300 truncate"></p>
            </div>
            <p id="mediaTitle" class="text-sm truncate text-slate-200 mt-1"></p>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-2">
          <button 
            id="btnDownloadVideo" 
            onclick="triggerDownload('video')" 
            class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-semibold rounded-xl text-xs md:text-sm transition duration-200 flex items-center justify-center space-x-1"
          >
            <span>📹 Baixar Vídeo (.MP4)</span>
          </button>

          <button 
            id="btnDownloadAudio" 
            onclick="triggerDownload('audio')" 
            class="w-full py-3 bg-amber-600 hover:bg-amber-500 font-semibold rounded-xl text-xs md:text-sm transition duration-200 flex items-center justify-center space-x-1"
          >
            <span>🎵 Apenas Áudio (.MP3)</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentVideoUrl = "";
    let currentAudioUrl = "";
    let currentTitle = "download";

    async function fetchMedia() {
      const urlInput = document.getElementById('mediaUrlInput').value.trim();
      const status = document.getElementById('status');
      const resultCard = document.getElementById('resultCard');
      const btnSearch = document.getElementById('btnSearch');

      if (!urlInput) {
        alert('Cole a URL de um vídeo.');
        return;
      }

      status.className = 'text-center text-sm text-yellow-400 block';
      status.innerText = 'Processando vídeo da plataforma...';
      resultCard.classList.add('hidden');
      btnSearch.disabled = true;

      try {
        const response = await fetch(`/api/download?url=${encodeURIComponent(urlInput)}`);
        const data = await response.json();

        if (response.ok && data.success) {
          status.classList.add('hidden');
          
          currentVideoUrl = data.videoUrl;
          currentAudioUrl = data.audioUrl || data.videoUrl;
          currentTitle = (data.title || 'media').replace(/[\\/*?:"<>|]/g, '').slice(0, 30);
          
          document.getElementById('mediaThumb').src = data.cover;
          document.getElementById('platformBadge').innerText = data.platform || 'Mídia';
          document.getElementById('mediaAuthor').innerText = data.author ? `@${data.author}` : '';
          document.getElementById('mediaTitle').innerText = data.title;
          
          resultCard.classList.remove('hidden');
        } else {
          status.className = 'text-center text-sm text-rose-400 block';
          status.innerText = data.error || 'Não foi possível obter a mídia deste link.';
        }
      } catch (err) {
        status.className = 'text-center text-sm text-rose-400 block';
        status.innerText = 'Erro ao se conectar ao servidor.';
      } finally {
        btnSearch.disabled = false;
      }
    }

    async function triggerDownload(type) {
      const isVideo = type === 'video';
      const targetUrl = isVideo ? currentVideoUrl : currentAudioUrl;
      const extension = isVideo ? 'mp4' : 'mp3';
      const targetBtn = document.getElementById(isVideo ? 'btnDownloadVideo' : 'btnDownloadAudio');
      const originalText = targetBtn.innerHTML;

      if (!targetUrl) return;

      targetBtn.disabled = true;
      targetBtn.innerHTML = `<span>Baixando...</span>`;

      try {
        const response = await fetch(targetUrl);
        if (!response.ok) throw new Error("CORS or stream error");
        
        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = blobUrl;
        a.download = `${currentTitle}.${extension}`;
        
        document.body.appendChild(a);
        a.click();
        
        window.URL.revokeObjectURL(blobUrl);
        document.body.removeChild(a);
      } catch (error) {
        // Fallback: se o navegador bloquear o blob por CORS, faz o download direto via link
        const a = document.createElement('a');
        a.href = targetUrl;
        a.target = '_blank';
        a.download = `${currentTitle}.${extension}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } finally {
        targetBtn.disabled = false;
        targetBtn.innerHTML = originalText;
      }
    }
  </script>
</body>
</html>
